; Configuration for the Opcache extension
; https://www.php.net/manual/en/opcache.configuration.php

; Enable Zend Opcache
opcache.enable=1

; Validate the script's timestamps for stale files every x seconds.
opcache.revalidate_freq=0

; Check file timestamps when opcache.validate_timestamps is enabled.
; If opcache.revalidate_freq is 0, this directive is ignored.
;opcache.revalidate_path=0

; The amount of shared memory (in megabytes) to be used by OPcache.
opcache.memory_consumption=128

; The maximum number of scripts that can be stored in the cache.
opcache.max_accelerated_files=10000

; The maximum percentage of "wasted" memory that is allowed in a cache block.
;opcache.max_wasted_percentage=5

; If enabled, comment lines in files will be removed at parsing.
opcache.save_comments=1

; If enabled, empty block statements will be removed.
;opcache.fast_shutdown=0

; If enabled, a PHP file can call opcache_invalidate() or opcache_reset()
; only when the current script is not cached.
;opcache.enable_file_override=0

; The location of the blacklist file. Each opcode cache blacklist file is a text file
; with the names of files that should not be accelerated.
;opcache.blacklist_filename=

; If enabled, OPcache will check the process's current working directory for
; changes when opcache.revalidate_freq is 0.
;opcache.consistency_checks=0

; If enabled, OPcache will generate a cache file for every PHP script.
;opcache.force_restart_timeout=0

; If enabled, OPcache will attempt to restart the opcode cache if an internal error occurs.
;opcache.error_log=

; This is a debug option and should not be used in production.
;opcache.log_verbosity_level=1

; The directory in which to store opcode cache files.
;opcache.restrict_api=

; The maximum length of string in bytes to intern.
opcache.interned_strings_buffer=8

; The amount of memory (in bytes) to allocate for optimization pass.
;opcache.optimization_level=0xffffffff

; If enabled, the opcache API will be available only from CLI.
;opcache.dups_fix=0

; If enabled, OPcache will check the integrity of the cached opcode before executing it.
;opcache.validate_timestamps_on_startup=0